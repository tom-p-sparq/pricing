<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Model Plots</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        padding: 1rem;
      }
      h1 {
        margin-bottom: 2rem;
      }
    </style>
  </head>
  <body>
    <h1>Pricing Model Visualizations</h1>

    <div><p>Here is some text.</p></div>

    <!-- The controls will be appended here -->
    <div id="controls-container"></div>

    <div><p>And here is some more text.</p></div>

    <!-- The plots will be appended here -->
    <div id="plot-container"></div>

    <!-- Use the library to create and render plots -->
    <script type="module">
      import { conversion, plotting, Inputs } from './pricing-core/bundle.js'

      // 1. Create the interactive inputs
      const elasticitySlider = Inputs.range([-5, -0.1], {
        step: 0.1,
        value: -2.5,
        label: 'Elasticity',
      })
      const conversionSlider = Inputs.range([0.01, 0.99], {
        step: 0.01,
        value: 0.3,
        label: 'Conversion at reference',
      })

      // 2. Add the inputs to the page
      document.getElementById('controls-container').append(elasticitySlider, conversionSlider)

      // 3. Define a function to render the plot based on current input values
      function render() {
        const reference = {
          price: 150,
          elasticity: elasticitySlider.value,
          conversion: conversionSlider.value,
        }
        const model = new conversion.WeibullDemandModel(reference)
        const plot = plotting.create(model, {
          title: 'Weibull Model (Standalone & Interactive)',
        })
        document.getElementById('plot-container').replaceChildren(plot)
      }

      // 4. Listen for changes and re-render
      elasticitySlider.addEventListener('input', render)
      conversionSlider.addEventListener('input', render)

      // 5. Render the initial plot
      render()
    </script>
  </body>
</html>
